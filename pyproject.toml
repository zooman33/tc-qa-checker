[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tc-qa-checker"
version = "0.1.0"
description = "Track-changes verification for bilingual DOCX translation files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul Chandravanshi", email = "rahulchandravanshi899@gmail.com" }]
keywords = ["localization", "translation", "qa", "docx", "track-changes", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "lxml>=5.0",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "typer>=0.12",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39", "openai>=1.40"]
embeddings = ["sentence-transformers>=3.0"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pre-commit>=3.8",
]

[project.scripts]
tc-qa-checker = "tc_qa_checker.cli:app"

[project.urls]
Homepage = "https://github.com/rahulchandravanshi/tc-qa-checker"
Repository = "https://github.com/rahulchandravanshi/tc-qa-checker"
Issues = "https://github.com/rahulchandravanshi/tc-qa-checker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_qa_checker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
